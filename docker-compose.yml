# Local Postgres for development. Port 5434 avoids clashing with a system Postgres on 5432/5433.
services:
  db:
    image: postgres:16-alpine
    container_name: modern-ecommerce-db
    environment:
      POSTGRES_USER: modernstore
      POSTGRES_PASSWORD: modernstore
      POSTGRES_DB: modernstore
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U modernstore']
      interval: 2s
      retries: 15

volumes:
  db-data:
